services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_SECRET=refillcare-dev-secret-2026
      - PORT=8000
    volumes:
      - ./backend/pharmacy.db:/app/pharmacy.db
      - ./backend/rx_store:/app/rx_store

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
